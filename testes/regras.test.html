<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes das regras</title>
<style>
  :root{ --paper:#f6f5f0; --surface:#ffffff; --ink:#1a231f; --muted:#5c645d; --line:#e2e0d5; --good:#1e8e4f; --good-soft:#e5f4ea; --critical:#c23b3b; --critical-soft:#fbe9e8; }
  @media (prefers-color-scheme: dark){ :root{ --paper:#141815; --surface:#1b201c; --ink:#eef0ea; --muted:#a4aa9f; --line:#2b3129; --good:#4cbf7c; --good-soft:#173325; --critical:#e5716d; --critical-soft:#3a1d1c; } }
  body{ margin:0; padding:24px 16px 48px; background:var(--paper); color:var(--ink); font:14px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  main{ max-width:820px; margin:0 auto; }
  h1{ font-size:20px; margin:0 0 4px; }
  p{ color:var(--muted); margin:0 0 16px; }
  #resumo{ padding:12px 16px; border-radius:8px; font-weight:700; margin-bottom:16px; }
  #resumo.ok{ background:var(--good-soft); color:var(--good); }
  #resumo.falha{ background:var(--critical-soft); color:var(--critical); }
  section{ background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
  h2{ font-size:14px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  ul{ list-style:none; margin:0; padding:4px 0; }
  li{ padding:5px 14px; display:flex; gap:10px; }
  li .st{ font-weight:700; flex:none; width:44px; }
  li.ok .st{ color:var(--good); }
  li.falha{ background:var(--critical-soft); }
  li.falha .st{ color:var(--critical); }
  li .det{ color:var(--critical); font-family:ui-monospace, monospace; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Testes das regras de cálculo</h1>
  <p>Confere as regras do <code>regras.js</code> (as mesmas que o painel e o checklist usam). Basta abrir esta página; nada é gravado em lugar nenhum. As regras do banco ficam em <code>testes/regras.test.sql</code>.</p>
  <div id="resumo">Rodando…</div>
  <div id="saida"></div>
</main>
<script src="../regras.js"></script>
<script>
(function(){
  "use strict";
  var grupos = [], atual = null, total = 0, falhas = 0;
  function grupo(nome){ atual = { nome: nome, casos: [] }; grupos.push(atual); }
  function igual(desc, obtido, esperado){
    total++;
    var ok = JSON.stringify(obtido) === JSON.stringify(esperado);
    if (!ok) falhas++;
    atual.casos.push({ desc: desc, ok: ok, obtido: obtido, esperado: esperado });
  }
  var R = window.Regras;
  if (!R){ document.getElementById("resumo").textContent = "Não carregou o regras.js."; document.getElementById("resumo").className = "falha"; return; }

  // ----------------------------------------------------------------------------
  grupo("Qualidade da Frota — status do veículo (pior anomalia aberta)");
  igual("1 crítica → Urgente",                       R.statusQualidade(1, 0, 1, true), "urgente");
  igual("1 alta → Reparo",                           R.statusQualidade(0, 1, 1, true), "reparo");
  igual("1 média (ou baixa) → Atenção",              R.statusQualidade(0, 0, 1, true), "atencao");
  igual("nenhuma aberta, já teve checklist → OK",    R.statusQualidade(0, 0, 0, true), "ok");
  igual("nunca teve checklist → Sem checklist",      R.statusQualidade(0, 0, 0, false), "sem");
  igual("crítica + alta + baixa → Urgente (a pior manda)", R.statusQualidade(1, 1, 3, true), "urgente");
  igual("alta + baixa → Reparo",                     R.statusQualidade(0, 1, 2, true), "reparo");
  igual("anomalia aberta sem checklist registrado → ainda conta", R.statusQualidade(0, 0, 1, false), "atencao");

  // ----------------------------------------------------------------------------
  grupo("Franquia de km (pool) — cor do % utilizado");
  igual("45,5% → verde",               R.faixaFranquia(45.5), "good");
  igual("84,9% → verde",               R.faixaFranquia(84.9), "good");
  igual("85% exato → amarelo",          R.faixaFranquia(85), "warn");
  igual("99,9% → amarelo",              R.faixaFranquia(99.9), "warn");
  igual("100% exato → vermelho",        R.faixaFranquia(100), "crit");
  igual("104,2% → vermelho",            R.faixaFranquia(104.2), "crit");
  igual("sem dado (contrato sem franquia) → neutro", R.faixaFranquia(null), "neutral");
  igual("0% → verde",                   R.faixaFranquia(0), "good");

  // ----------------------------------------------------------------------------
  grupo("Manutenções — OS vencida (badge e aviso)");
  var agora = new Date("2026-10-21T15:00:00-03:00");
  igual("em execução, previsão ontem → vencida",
        R.osVencida({ status: "em_execucao", previsao_retorno: "2026-10-20T12:00:00-03:00" }, agora), true);
  igual("em execução, previsão amanhã → não",
        R.osVencida({ status: "em_execucao", previsao_retorno: "2026-10-22T12:00:00-03:00" }, agora), false);
  igual("aguardando peça, previsão passada → vencida",
        R.osVencida({ status: "aguardando_peca", previsao_retorno: "2026-10-01T12:00:00-03:00" }, agora), true);
  igual("só agendada (carro não parou), previsão passada → não",
        R.osVencida({ status: "agendada", previsao_retorno: "2026-10-01T12:00:00-03:00" }, agora), false);
  igual("concluída, previsão passada → não",
        R.osVencida({ status: "concluida", previsao_retorno: "2026-10-01T12:00:00-03:00" }, agora), false);
  igual("cancelada, previsão passada → não",
        R.osVencida({ status: "cancelada", previsao_retorno: "2026-10-01T12:00:00-03:00" }, agora), false);
  igual("sem previsão de retorno → não",
        R.osVencida({ status: "em_execucao", previsao_retorno: null }, agora), false);

  // ----------------------------------------------------------------------------
  grupo("Checklist — aviso de km menor que o último registrado");
  igual("informou 9.900, último checklist 10.000 → avisa (ref. 10.000)", R.kmAbaixoDoUltimo(9900, 10000, 9500), 10000);
  igual("compara com o maior entre checklist e cadastro (cadastro 10.050)", R.kmAbaixoDoUltimo(10020, 10000, 10050), 10050);
  igual("igual ao último → não avisa",                    R.kmAbaixoDoUltimo(10000, 10000, 9000), 0);
  igual("maior que o último → não avisa",                 R.kmAbaixoDoUltimo(10100, 10000, 10050), 0);
  igual("veículo sem km conhecido → não avisa",           R.kmAbaixoDoUltimo(500, null, null), 0);
  igual("km ainda não preenchido → não avisa",            R.kmAbaixoDoUltimo("", 10000, 10000), 0);
  igual("km digitado como texto (\"9900\") → avisa",       R.kmAbaixoDoUltimo("9900", "10000", null), 10000);

  // ----------------------------------------------------------------------------
  grupo("Revisão preventiva — próximo marco e aviso");
  igual("sem histórico → próximo marco 10.000",            R.proximoMarco(null), 10000);
  igual("último feito 40.000 → próximo 50.000",            R.proximoMarco(40000), 50000);
  igual("48.999 km, marco 50.000 → em dia (faltam 1.001)", R.situacaoRevisao(48999, 50000, true), "em_dia");
  igual("49.000 km, marco 50.000 → vencendo (exatamente 1.000 antes)", R.situacaoRevisao(49000, 50000, true), "vencendo");
  igual("49.999 km → vencendo",                            R.situacaoRevisao(49999, 50000, true), "vencendo");
  igual("50.000 km → vencida (chegou no marco)",           R.situacaoRevisao(50000, 50000, true), "vencida");
  igual("km em texto (\"52000\") → vencida",              R.situacaoRevisao("52000", 50000, true), "vencida");
  igual("modelo sem plano de itens → sem_plano",           R.situacaoRevisao(90000, 10000, false), "sem_plano");

  // ----------------------------------------------------------------------------
  grupo("Multas — pontos na CNH por grau");
  igual("leve = 3",       R.PONTOS_POR_GRAU.leve, 3);
  igual("média = 4",      R.PONTOS_POR_GRAU.media, 4);
  igual("grave = 5",      R.PONTOS_POR_GRAU.grave, 5);
  igual("gravíssima = 7", R.PONTOS_POR_GRAU.gravissima, 7);

  // ----------------------------------------------------------------------------
  grupo("Visão Executiva — quem pode ver");
  igual("admin ativo → vê",                                   R.podeVerExecutivo({ papel:"admin", ativo:true }), true);
  igual("admin desativado → não vê",                          R.podeVerExecutivo({ papel:"admin", ativo:false }), false);
  igual("visualizador com 'executivo' → vê",                  R.podeVerExecutivo({ papel:"visualizador", ativo:true, modulos_visualizacao:["executivo","frota"] }), true);
  igual("visualizador sem 'executivo' → não vê",              R.podeVerExecutivo({ papel:"visualizador", ativo:true, modulos_visualizacao:["frota"] }), false);
  igual("visualizador desativado com 'executivo' → não vê",   R.podeVerExecutivo({ papel:"visualizador", ativo:false, modulos_visualizacao:["executivo"] }), false);
  igual("operador com 'executivo' gravado → não vê",          R.podeVerExecutivo({ papel:"operador", ativo:true, modulos_visualizacao:["executivo"], modulos_operador:["executivo"] }), false);
  igual("sem perfil carregado → não vê",                      R.podeVerExecutivo(null), false);

  // ----------------------------------------------------------------------------
  grupo("OS — tempo em cada status (texto)");
  var MIN = 60000, HORA = 60 * MIN, DIA = 24 * HORA;
  igual("30 segundos → menos de 1 min",        R.duracaoTexto(30000), "menos de 1 min");
  igual("40 min",                              R.duracaoTexto(40 * MIN), "40 min");
  igual("59 min 59 s → 59 min (arredonda para baixo)", R.duracaoTexto(60 * MIN - 1000), "59 min");
  igual("5 h exatas → 5 h",                    R.duracaoTexto(5 * HORA), "5 h");
  igual("5 h 20 min",                          R.duracaoTexto(5 * HORA + 20 * MIN), "5 h 20 min");
  igual("2 dias exatos → 2 d",                 R.duracaoTexto(2 * DIA), "2 d");
  igual("2 d 3 h (minutos não aparecem)",      R.duracaoTexto(2 * DIA + 3 * HORA + 45 * MIN), "2 d 3 h");
  igual("negativo → —",                        R.duracaoTexto(-5), "—");
  igual("vazio → —",                           R.duracaoTexto(undefined), "—");

  grupo("Visão Executiva — datas do período");
  igual("mês atual: dia 1 até hoje",            JSON.stringify(R.periodoDatas("mes", "2026-10-23")), JSON.stringify({ ini:"2026-10-01", fim:"2026-10-23" }));
  igual("mês anterior: setembro inteiro (30)",  JSON.stringify(R.periodoDatas("mes_anterior", "2026-10-23")), JSON.stringify({ ini:"2026-09-01", fim:"2026-09-30" }));
  igual("mês anterior em janeiro: dezembro do ano anterior", JSON.stringify(R.periodoDatas("mes_anterior", "2027-01-05")), JSON.stringify({ ini:"2026-12-01", fim:"2026-12-31" }));
  igual("mês anterior em março: fevereiro (28)", JSON.stringify(R.periodoDatas("mes_anterior", "2027-03-10")), JSON.stringify({ ini:"2027-02-01", fim:"2027-02-28" }));
  igual("ano: 1º de janeiro até hoje",          JSON.stringify(R.periodoDatas("ano", "2026-10-23")), JSON.stringify({ ini:"2026-01-01", fim:"2026-10-23" }));

  grupo("Elétricos — custo por km só com km e recargas do mesmo período");
  igual("tudo coberto → confiável",               R.coberturaCustoKm("2026-11-01", "2026-11-30", "2026-10-12", "2026-11-28").length, 0);
  igual("telemetria começou depois do início",    R.coberturaCustoKm("2026-10-01", "2026-10-23", "2026-10-12", "2026-10-22").join(" | "), "telemetria de km só desde 12/10/2026");
  igual("recarga parada há mais de 7 dias",       R.coberturaCustoKm("2026-11-01", "2026-11-30", "2026-10-12", "2026-11-20").join(" | "), "recargas lançadas só até 20/11/2026");
  igual("recarga exatamente 7 dias antes → ok",   R.coberturaCustoKm("2026-11-01", "2026-11-30", "2026-10-12", "2026-11-23").length, 0);
  igual("situação de 23/10/2026 (os dois motivos)", R.coberturaCustoKm("2026-10-01", "2026-10-23", "2026-10-12", "2026-10-06").join(" | "), "telemetria de km só desde 12/10/2026 | recargas lançadas só até 06/10/2026");
  igual("sem telemetria e sem recarga",           R.coberturaCustoKm("2026-10-01", "2026-10-23", null, null).join(" | "), "sem telemetria de km | nenhuma recarga lançada");

  grupo("Financeiro — mês fechado (dia 05 do mês seguinte) e projeção do ano");
  igual("somar meses atravessa o ano",             R.somaMeses("2026-11", 3), "2027-02");
  igual("subtrair meses atravessa o ano",          R.somaMeses("2026-01", -2), "2025-11");
  igual("setembro fechado em 05/10",               R.mesFechado("2026-09", "2026-10-05"), true);
  igual("setembro ainda aberto em 04/10",          R.mesFechado("2026-09", "2026-10-04"), false);
  igual("dezembro fecha em 05/01 do ano seguinte", R.mesFechado("2026-12", "2027-01-05"), true);
  igual("último fechado em 23/10 = setembro",      R.ultimoMesFechado("2026-10-23"), "2026-09");
  igual("último fechado em 04/10 = agosto",        R.ultimoMesFechado("2026-10-04"), "2026-08");
  igual("último fechado em 03/01/2027 = nov/2026", R.ultimoMesFechado("2027-01-03"), "2026-11");
  var VAL = { "2026-01":100, "2026-02":100, "2026-03":100, "2026-04":100, "2026-05":100, "2026-06":100, "2026-07":200, "2026-08":300, "2026-09":400, "2026-10":30 };
  var RES = R.resumoFinanceiro(VAL, "2026-10-23");
  igual("média dos 3 últimos fechados (jul–set) = 300", RES.media3, 300);
  igual("realizado do ano só com fechados (jan–set) = 1.500", RES.realizadoAno, 1500);
  igual("meses restantes = 3 (out, nov, dez)",     RES.mesesRestantes, 3);
  igual("projeção = 1.500 + 300 × 3 = 2.400",      RES.projecao, 2400);
  igual("mês atual: lançado 30 = 10% da média",    RES.lancadoAtual + " / " + RES.pctMediaAtual + "%", "30 / 10%");
  var RES2 = R.resumoFinanceiro(VAL, "2026-10-04");
  igual("antes do dia 05: setembro entra na projeção pela média", RES2.ultimoFechado + " / " + RES2.mesesRestantes + " / " + RES2.realizadoAno, "2026-08 / 4 / 1100");
  var RES3 = R.resumoFinanceiro({ "2026-10":90, "2026-11":120, "2026-12":90 }, "2027-01-10");
  igual("janeiro: nenhum mês fechado no ano; projeção = média (100) × 12", RES3.realizadoAno + " / " + RES3.mesesRestantes + " / " + RES3.projecao, "0 / 12 / 1200");
  igual("sem histórico: % da média vazio",          R.resumoFinanceiro({}, "2026-10-23").pctMediaAtual, null);

  grupo("Multas — motivo agrupado (textos reais da base)");
  igual("motivo vem antes do ' | '",                  R.motivoDaDescricao("ESTACIONAR NO PASSEIO | Status original planilha: X"), "ESTACIONAR NO PASSEIO");
  igual("descrição só com status → sem motivo",       R.motivoDaDescricao("Status original planilha: MOTORISTA NÃO IDENTIFICADO"), "");
  igual("velocidade até 20% (com acento)",            R.classificarMotivo("TRANSITAR EM VELOCIDADE SUPERIOR A MÁXIMA PERMITIDA EM ATE 20%"), "Velocidade até 20%");
  igual("velocidade até 20% (sem acento, com sufixo)", R.classificarMotivo("TRANSITAR EM VELOCIDADE SUPERIOR A MAXIMA PERMITIDA EM ATE IDENTIFICAÇÃO DO AGENTE OU AUTORIDADE DE TRÂNSITO"), "Velocidade até 20%");
  igual("velocidade de 20% a 50%",                    R.classificarMotivo("TRANSITAR EM VELOCIDADE SUPERIOR À MÁXIMA PERMITIDA EM MAIS DE 20% ATE 50%"), "Velocidade de 20% a 50%");
  igual("velocidade acima de 50%",                    R.classificarMotivo("TRANSITAR EM VELOCIDADE SUPERIOR À MÁXIMA PERMITIDA EM MAIS DE 50%"), "Velocidade acima de 50%");
  igual("sinal vermelho (variação longa)",            R.classificarMotivo("AVANÇAR O SINAL VERMELHO DO SEMÁFORO EXC HOUVER SINALIZ IDENTIFICAÇÃO DO AGENTE"), "Sinal vermelho");
  igual("faixa exclusiva de ônibus",                  R.classificarMotivo("TRANSITAR NA FAIXA OU VIA EXCLUSIVA REGULAM P/ TRANSP PÚBL COLETIVO PASSAG (ART. 184, III DO CTB)"), "Faixa exclusiva");
  igual("estacionamento (rotativo)",                  R.classificarMotivo("ESTACIONAR EM DESACORDO COM A REGULAMENTAÇÃO (ESTACIONAMENTO ROTATIVO)"), "Estacionamento irregular");
  igual("fora da faixa",                              R.classificarMotivo("DEIXAR DE CONSERVAR O VEÍCULO NA FAIXA A ELE DESTINADA"), "Fora da faixa");
  igual("marcha à ré",                                R.classificarMotivo("TRANSITAR EM MARCHA À RÉ EM DESACORDO"), "Marcha à ré");
  igual("conversão à esquerda",                       R.classificarMotivo("EXECUTAR OPERAÇÃO DE CONVERSÃO A ESQUERDA"), "Conversão ou retorno proibido");
  igual("horário não permitido",                      R.classificarMotivo("TRANSITAR EM LOCAL/HORARIO NAO PERMITIDO"), "Rodízio / horário não permitido");
  igual("celular",                                    R.classificarMotivo("DIRIGIR VEICULO MANUSEANDO TELEFONE CELULAR"), "Celular ao volante");
  igual("evasão de pedágio",                          R.classificarMotivo("EVADIR-SE DA COBRANÇA PELO USO DE RODOVIAS/VIAS URBANAS"), "Evasão de pedágio");
  igual("não identificação do condutor",              R.classificarMotivo("MULTA POR NAO IDENTIFICACAO DO CONDUTOR INFRATOR"), "Não identificação do condutor");
  igual("nome do motorista no começo → sem motivo (nome nunca vira motivo)", R.motivoDaDescricao("Motorista (planilha): FULANO DE TAL | Status original planilha: X"), "");
  igual("motivo com nome do motorista no meio", R.motivoDaDescricao("ESTACIONAR NO PASSEIO | Motorista (planilha): FULANO | Status original planilha: X"), "ESTACIONAR NO PASSEIO");
  igual("marcha ré sem o à", R.classificarMotivo("TRANSITAR EM MARCHA RE, SALVO NA DISTANCIA NECESSARIA"), "Marcha à ré");
  igual("contramão", R.classificarMotivo("TRANSITAR PELA CONTRAMÃO DE DIREÇÃO"), "Contramão");
  igual("horário de pico", R.classificarMotivo("TRANSITAR EM LOCAL E HORÁRIO PROIBIDO HORÁRIO DE PICO"), "Rodízio / horário não permitido");
  igual("faixa da direita exclusiva", R.classificarMotivo("TRANSITAR NA FAIXA/PISTA DA DIREITA REGUL CIRCULAÇÃO EXCLUSIVA DETERM VEÍCULO"), "Faixa exclusiva");
  igual("texto desconhecido → Outros",                R.classificarMotivo("ALGUMA INFRAÇÃO NOVA"), "Outros");
  igual("vazio → Sem motivo informado",               R.classificarMotivo(""), "Sem motivo informado");

  grupo("Disponibilidade da frota — cor");
  igual("90% → verde",          R.faixaDisponibilidade(90), "good");
  igual("89,9% → amarelo",      R.faixaDisponibilidade(89.9), "warn");
  igual("80% → amarelo",        R.faixaDisponibilidade(80), "warn");
  igual("79,9% → vermelho",     R.faixaDisponibilidade(79.9), "crit");
  igual("sem dado → neutro",    R.faixaDisponibilidade(null), "neutral");

  grupo("OS — status de liberação (as 4 opções do Jefferson)");
  igual("4 opções, na ordem", Object.keys(R.STATUS_LIBERACAO).join(","), "aguardando_orcamento,em_reparo,pronto_retirada,liberado");
  igual("texto de pronto_retirada", R.STATUS_LIBERACAO.pronto_retirada, "Pronto, aguardando retirada");

  grupo("Descontos — parcelas sugeridas (multa pela gravidade, avaria pelo valor)");
  igual("multa leve → 1x",                 R.parcelasSugeridas("multa", "leve"), 1);
  igual("multa média → 3x",                R.parcelasSugeridas("multa", "media"), 3);
  igual("multa grave → 6x",                R.parcelasSugeridas("multa", "grave"), 6);
  igual("multa gravíssima → 6x",           R.parcelasSugeridas("multa", "gravissima"), 6);
  igual("multa sem gravidade → sem sugestão", R.parcelasSugeridas("multa", null), null);
  igual("multa ignora o valor",            R.parcelasSugeridas("multa", "leve", 5000), 1);
  igual("avaria R$ 150 → 1x",              R.parcelasSugeridas("avaria", null, 150), 1);
  igual("avaria R$ 300,00 → 1x (limite)",  R.parcelasSugeridas("avaria", null, 300), 1);
  igual("avaria R$ 300,01 → 3x",           R.parcelasSugeridas("avaria", null, 300.01), 3);
  igual("avaria R$ 300,50 → 3x",           R.parcelasSugeridas("avaria", null, 300.5), 3);
  igual("avaria R$ 600,00 → 3x (limite)",  R.parcelasSugeridas("avaria", null, 600), 3);
  igual("avaria R$ 600,01 → 6x",           R.parcelasSugeridas("avaria", null, 600.01), 6);
  igual("avaria R$ 5.000 → 6x (teto)",     R.parcelasSugeridas("avaria", null, 5000), 6);
  igual("avaria valor em texto '450' → 3x", R.parcelasSugeridas("avaria", null, "450"), 3);
  igual("avaria sem valor → sem sugestão",  R.parcelasSugeridas("avaria", null, null), null);
  igual("avaria valor zero → sem sugestão", R.parcelasSugeridas("avaria", null, 0), null);
  igual("avaria ignora a gravidade",       R.parcelasSugeridas("avaria", "gravissima", 100), 1);
  igual("tipo desconhecido → sem sugestão", R.parcelasSugeridas("outro", "leve", 100), null);
  igual("ajuste manual: 1 vale",           R.parcelasValidas(1), true);
  igual("ajuste manual: 6 vale (teto)",    R.parcelasValidas(6), true);
  igual("ajuste manual: 7 não vale",       R.parcelasValidas(7), false);
  igual("ajuste manual: 0 não vale",       R.parcelasValidas(0), false);
  igual("ajuste manual: 2,5 não vale",     R.parcelasValidas(2.5), false);

  grupo("Descontos — fases e destino do valor");
  igual("9 fases, na ordem do banco",      R.DESCONTO_FASES.map(function(f){ return f.chave; }).join(","),
        "enviado_lider,avaliacao_frota,conferencia_frota,analise_rh,encaminhado_dp,rejeitada_dp,confirmado_dp,custo_beep,cobranca_errada");
  igual("finais: Confirmado, Custo Beep e Cobrança errada", R.DESCONTO_FASES.filter(function(f){ return f.final; }).map(function(f){ return f.chave; }).join(","), "confirmado_dp,custo_beep,cobranca_errada");
  igual("Rejeitada pelo DP não é final",   R.faseDesconto("rejeitada_dp").final, false);
  igual("nome da fase",                    R.faseDesconto("conferencia_frota").nome, "Conferência da Frota");
  igual("fase desconhecida → null",        R.faseDesconto("xyz"), null);
  igual("Confirmado pelo DP → cobrança do motorista", R.destinoContabil("confirmado_dp").nome, "Cobrança do motorista");
  igual("Custo Beep → empresa",            R.destinoContabil("custo_beep").nome, "Custo Beep (empresa)");
  igual("Cobrança errada → sem custo",     R.destinoContabil("cobranca_errada").nome, "Sem custo");
  igual("Rejeitada pelo DP → em andamento", R.destinoContabil("rejeitada_dp").nome, "Em andamento");
  igual("destino = coluna resultado do banco", ["confirmado_dp","custo_beep","cobranca_errada","enviado_lider"].map(function(f){ return R.destinoContabil(f).chave; }).join(","),
        "repasse_motorista,custo_beep,sem_custo,em_andamento");

  // ---------------------------------------------------------------- mostra
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;" }[c]; }); };
  document.getElementById("saida").innerHTML = grupos.map(function(g){
    return "<section><h2>" + esc(g.nome) + "</h2><ul>" + g.casos.map(function(c){
      return '<li class="' + (c.ok ? "ok" : "falha") + '"><span class="st">' + (c.ok ? "ok" : "FALHA") + "</span><span>" + esc(c.desc) +
        (c.ok ? "" : '<br><span class="det">esperado: ' + esc(JSON.stringify(c.esperado)) + " · obtido: " + esc(JSON.stringify(c.obtido)) + "</span>") + "</span></li>";
    }).join("") + "</ul></section>";
  }).join("");
  var r = document.getElementById("resumo");
  r.className = falhas ? "falha" : "ok";
  r.textContent = falhas ? (falhas + " de " + total + " testes falharam") : ("Todos os " + total + " testes passaram");
  document.title = (falhas ? "FALHA " : "OK ") + "Testes das regras";
  window.RESULTADO_TESTES = { total: total, falhas: falhas };
})();
</script>
