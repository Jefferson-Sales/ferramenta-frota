<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Checklist do Veículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Formulário mobile do checklist (Retirada / Devolução / Inspeção técnica). Mesmos tokens do index.html. */
  :root{
    --paper:#f6f5f0; --surface:#ffffff; --surface-2:#efeee7; --ink:#1a231f; --muted:#5c645d; --faint:#8a8f87;
    --line:#e2e0d5; --line-strong:#cfccbd; --accent:#0e7c66; --accent-ink:#ffffff; --accent-soft:#e2f2ee; --accent-soft-line:#bfe1d7;
    --good:#1e8e4f; --good-soft:#e5f4ea; --warning:#a8690a; --warning-soft:#faf0dd; --critical:#c23b3b; --critical-soft:#fbe9e8;
    --shadow: 0 1px 2px rgba(20,25,20,.04), 0 8px 24px rgba(20,25,20,.05); --radius:10px;
    --font-display:"Archivo", ui-sans-serif, system-ui, sans-serif;
    --font-body:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* tokens de forma: mesmos valores de antes, agora com nome (não mudam com o tema) */
    --fs-3xs:10.5px; --fs-2xs:11px; --fs-xs:11.5px; --fs-sm:12px; --fs-sm-2:12.5px; --fs-md:13px; --fs-md-2:13.5px; --fs-lg:14px; --fs-lg-2:14.5px; --fs-xl:16px; --fs-xl-2:17px; --fs-2xl:18px; --fs-2xl-2:19px; --fs-3xl:20px; --fs-3xl-2:21px; --fs-4xl:24px; --fs-6xl:34px;
    --raio-xs:2px; --raio-sm:6px; --raio-md-2:7px; --raio-md:8px; --raio-md-3:9px; --raio-lg:10px; --raio-xl:12px; --raio-2xl:22px; --raio-pilula:999px;
    --espaco-1:4px; --espaco-2:6px; --espaco-3:8px; --espaco-4:10px; --espaco-5:12px; --espaco-6:14px; --espaco-7:16px; --espaco-8:18px;
    --texto-sobre-cor:#ffffff; --fundo-modal:rgba(10,15,12,.4); --fundo-legenda-foto:rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141815; --surface:#1b201c; --surface-2:#232823; --ink:#eef0ea; --muted:#a4aa9f; --faint:#767c73;
      --line:#2b3129; --line-strong:#3a4139; --accent:#42b599; --accent-ink:#0a1512; --accent-soft:#173129; --accent-soft-line:#264a3f;
      --good:#4cbf7c; --good-soft:#173325; --warning:#e0a94a; --warning-soft:#332609; --critical:#e5716d; --critical-soft:#3a1d1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141815; --surface:#1b201c; --surface-2:#232823; --ink:#eef0ea; --muted:#a4aa9f; --faint:#767c73;
    --line:#2b3129; --line-strong:#3a4139; --accent:#42b599; --accent-ink:#0a1512; --accent-soft:#173129; --accent-soft-line:#264a3f;
    --good:#4cbf7c; --good-soft:#173325; --warning:#e0a94a; --warning-soft:#332609; --critical:#e5716d; --critical-soft:#3a1d1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:var(--fs-xl); line-height:1.4; }
  body{ padding-bottom:calc(84px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent; }
  header{ position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:var(--espaco-4) var(--espaco-7) var(--espaco-3); }
  .hdr-row{ display:flex; align-items:center; justify-content:space-between; gap:var(--espaco-3); max-width:960px; margin:0 auto; }
  h1{ font-family:var(--font-display); font-size:var(--fs-2xl); margin:0; letter-spacing:-.01em; }
  .who{ font-size:var(--fs-sm-2); color:var(--muted); text-align:right; }
  .who button{ font-size:var(--fs-sm-2); }
  .steps{ display:flex; gap:var(--espaco-1); max-width:960px; margin:var(--espaco-3) auto 0; }
  .steps div{ flex:1; height:4px; border-radius:var(--raio-xs); background:var(--line); }
  .steps div.on{ background:var(--accent); }
  .step-label{ max-width:960px; margin:var(--espaco-1) auto 0; font-size:var(--fs-sm); color:var(--muted); }
  main{ max-width:960px; margin:0 auto; padding:var(--espaco-7); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:var(--espaco-6); margin-bottom:var(--espaco-5); }
  .card h2{ font-family:var(--font-display); font-size:var(--fs-xl); margin:0 0 var(--espaco-4); }
  .card h3{ font-size:var(--fs-lg); margin:var(--espaco-5) 0 var(--espaco-2); color:var(--muted); font-weight:600; }
  label.lbl{ display:block; font-size:var(--fs-md); font-weight:600; color:var(--muted); margin:var(--espaco-5) 0 var(--espaco-2); }
  input[type=text], input[type=number], input[type=email], input[type=password], select, textarea{
    width:100%; font:inherit; font-size:var(--fs-xl); color:var(--ink); background:var(--surface); border:1px solid var(--line-strong);
    border-radius:var(--raio-md); padding:var(--espaco-5); min-height:48px; }
  textarea{ min-height:80px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .mono{ font-family:var(--font-mono); letter-spacing:.04em; }
  .row{ display:flex; gap:var(--espaco-3); }
  .row > *{ flex:1; }
  button{ font:inherit; cursor:pointer; }
  .btn{ min-height:48px; border-radius:var(--raio-md); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:var(--espaco-4) var(--espaco-6); font-weight:600; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); min-height:36px; padding:var(--espaco-2) var(--espaco-3); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .flex-none{ flex:none !important; }
  .chips{ display:flex; flex-wrap:wrap; gap:var(--espaco-3); }
  .chip{ min-height:44px; padding:var(--espaco-3) var(--espaco-6); border-radius:var(--raio-2xl); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:500; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip.sev-baixa.on{ background:var(--muted); border-color:var(--muted); color:var(--paper); }
  .chip.sev-media.on{ background:var(--warning); border-color:var(--warning); color:var(--texto-sobre-cor); }
  .chip.sev-alta.on{ background:var(--critical); border-color:var(--critical); color:var(--texto-sobre-cor); opacity:.85; }
  .chip.sev-critica.on{ background:var(--critical); border-color:var(--critical); color:var(--texto-sobre-cor); }
  .choice{ display:grid; grid-template-columns:1fr 1fr; gap:var(--espaco-3); }
  .choice .chip{ border-radius:var(--raio-md); min-height:52px; font-weight:600; }
  .chip.ok.on{ background:var(--good); border-color:var(--good); color:var(--texto-sobre-cor); }
  .chip.bad.on{ background:var(--critical); border-color:var(--critical); color:var(--texto-sobre-cor); }
  .badge{ display:inline-block; font-size:var(--fs-xs); font-weight:600; padding:2px var(--espaco-3); border-radius:var(--raio-lg); background:var(--surface-2); color:var(--muted); }
  .badge.baixa{ background:var(--surface-2); color:var(--muted); }
  .badge.media{ background:var(--warning-soft); color:var(--warning); }
  .badge.alta{ background:var(--critical-soft); color:var(--critical); }
  .badge.critica{ background:var(--critical); color:var(--texto-sobre-cor); }
  .hint{ font-size:var(--fs-md); color:var(--muted); margin:var(--espaco-2) 0 0; }
  .warn{ font-size:var(--fs-md); color:var(--warning); background:var(--warning-soft); border-radius:var(--raio-md); padding:var(--espaco-3) var(--espaco-4); margin-top:var(--espaco-3); }
  .err{ font-size:var(--fs-md-2); color:var(--critical); background:var(--critical-soft); border-radius:var(--raio-md); padding:var(--espaco-3) var(--espaco-4); margin-top:var(--espaco-3); }
  .okbox{ font-size:var(--fs-md-2); color:var(--good); background:var(--good-soft); border-radius:var(--raio-md); padding:var(--espaco-3) var(--espaco-4); margin-top:var(--espaco-3); }
  .veic{ display:flex; justify-content:space-between; gap:var(--espaco-3); align-items:flex-start; background:var(--accent-soft); border:1px solid var(--accent-soft-line); border-radius:var(--raio-md); padding:var(--espaco-4) var(--espaco-5); margin-top:var(--espaco-4); }
  .veic b{ font-family:var(--font-mono); font-size:var(--fs-xl-2); }
  .grupo{ border-left:4px solid var(--line-strong); }
  .grupo.st-ok{ border-left-color:var(--good); }
  .grupo.st-problema{ border-left-color:var(--critical); }
  .prev{ font-size:var(--fs-sm); color:var(--faint); font-weight:500; margin-left:var(--espaco-2); }
  .abert{ border:1px solid var(--line); border-radius:var(--raio-md); padding:var(--espaco-4); margin-bottom:var(--espaco-3); background:var(--surface-2); }
  .abert .top{ display:flex; gap:var(--espaco-4); align-items:flex-start; }
  .abert img, .thumbs img{ width:64px; height:64px; object-fit:cover; border-radius:var(--raio-sm); border:1px solid var(--line); flex:none; background:var(--surface); }
  .anom{ border:1px dashed var(--line-strong); border-radius:var(--raio-md); padding:var(--espaco-4); margin-top:var(--espaco-4); }
  .anom-hdr{ display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:var(--fs-lg); }
  .thumbs{ display:flex; flex-wrap:wrap; gap:var(--espaco-3); margin-top:var(--espaco-3); align-items:center; }
  .thumb{ position:relative; }
  .thumb .st{ position:absolute; left:0; right:0; bottom:0; font-size:var(--fs-3xs); text-align:center; background:var(--fundo-legenda-foto); color:var(--texto-sobre-cor); border-radius:0 0 var(--raio-sm) var(--raio-sm); padding:1px 0; }
  .thumb .st.err{ background:var(--critical); margin:0; padding:1px 0; }
  .thumb .bar{ position:absolute; left:3px; right:3px; bottom:3px; height:4px; background:rgba(255,255,255,.4); border-radius:var(--raio-xs); overflow:hidden; }
  .thumb .bar i{ display:block; height:100%; background:var(--accent); }
  .cam{ width:64px; height:64px; border:1px dashed var(--line-strong); border-radius:var(--raio-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:var(--fs-2xs); color:var(--muted); background:var(--surface); }
  .cam svg{ width:22px; height:22px; margin-bottom:2px; }
  .fixas{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--espaco-3); }
  .fixa{ border:1px solid var(--line); border-radius:var(--raio-md); padding:var(--espaco-3); text-align:center; font-size:var(--fs-md); font-weight:600; }
  .fixa .cam, .fixa img{ width:100%; height:auto; aspect-ratio:1; margin-top:var(--espaco-2); }
  .fixa img{ object-fit:cover; border-radius:var(--raio-sm); }
  .resumo li{ margin-bottom:var(--espaco-2); }
  .final{ text-align:center; padding:28px var(--espaco-7); }
  .final .big{ font-family:var(--font-display); font-size:var(--fs-4xl); margin:var(--espaco-4) 0; }
  .res-ok{ color:var(--good); } .res-atencao{ color:var(--warning); } .res-reparo_necessario, .res-urgente{ color:var(--critical); }
  .bottom{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:6; }
  .bottom .row{ max-width:960px; margin:0 auto; }
  .hidden{ display:none !important; }
  .papeis{ display:grid; gap:var(--espaco-5); }
  .papel{ display:flex; align-items:center; gap:var(--espaco-6); width:100%; min-height:92px; padding:var(--espaco-7); text-align:left;
    background:var(--surface); color:var(--ink); border:2px solid var(--line-strong); border-radius:var(--raio-xl); box-shadow:var(--shadow); }
  .papel:active{ border-color:var(--accent); background:var(--accent-soft); }
  .papel .ico{ font-size:var(--fs-6xl); line-height:1; flex:none; }
  .papel b{ display:block; font-family:var(--font-display); font-size:var(--fs-2xl-2); }
  .papel span.sub{ display:block; font-size:var(--fs-lg); color:var(--muted); margin-top:2px; }
  .papel-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--espaco-1); }
  .papel-topo .badge{ font-size:var(--fs-sm-2); }
  .tc{ display:inline-block; margin-top:var(--espaco-1); font-size:var(--fs-sm); font-weight:600; padding:2px var(--espaco-3); border-radius:var(--raio-lg); background:var(--surface); border:1px solid var(--accent-soft-line); }
  #toast{ position:fixed; left:16px; right:16px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:9; display:flex; justify-content:center; pointer-events:none; }
  #toast div{ background:var(--ink); color:var(--paper); padding:var(--espaco-4) var(--espaco-6); border-radius:var(--raio-md); font-size:var(--fs-lg); max-width:520px; box-shadow:var(--shadow); }
  #toast div.e{ background:var(--critical); color:var(--texto-sobre-cor); }
  @media (min-width:900px){
    .grupos-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--espaco-5); align-items:start; }
    .grupos-grid .card{ margin-bottom:0; }
  }
</style>
</head>
<body>
<header>
  <div class="hdr-row">
    <h1>Checklist do Veículo</h1>
    <div class="who" id="who"></div>
  </div>
  <div class="steps" id="steps"><div></div><div></div><div></div><div></div></div>
  <div class="step-label" id="step-label"></div>
</header>
<main id="main"></main>
<div class="bottom" id="bottom">
  <div class="row">
    <button class="btn flex-none" id="btn-voltar" type="button">Voltar</button>
    <button class="btn primary" id="btn-proximo" type="button">Próximo</button>
  </div>
</div>
<div id="toast"></div>

<script src="regras.js"></script>
<script>
(function(){
  "use strict";

  var SUPA_URL = "https://efmpzjkqiwyuumaoumof.supabase.co";
  var SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmbXB6amtxaXd5dXVtYW91bW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjkzMDAsImV4cCI6MjEwNzE0NTMwMH0.k0AFjsUrT1HDjNe4D-k75LYgZ3DeOVDGCZvq-2cNozw";
  var FN_URL = SUPA_URL + "/functions/v1/checklist";
  var DRAFT_KEY = "ck_rascunho_v1", SESSION_KEY = "ck_sessao_v1", APARELHO_KEY = "ck_aparelho_v1";
  // Id aleatório deste aparelho, só para o limite de tentativas de matrícula (o servidor guarda cifrado).
  var APARELHO = (function(){
    var id = null;
    try{ id = localStorage.getItem(APARELHO_KEY); }catch(e){}
    if (!id){
      var b = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(b);
      id = Array.prototype.map.call(b, function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
      try{ localStorage.setItem(APARELHO_KEY, id); }catch(e){}
    }
    return id;
  })();

  var STEP_NAMES = ["Identificação", "Itens do veículo", "Combustível e fotos", "Revisão e envio"];
  var TIPOS = { retirada:"Retirada", devolucao:"Devolução", inspecao_tecnica:"Inspeção técnica" };
  var SEV = { baixa:"Baixa", media:"Média", alta:"Alta", critica:"Crítica" };
  var RES = { ok:"OK", atencao:"Atenção", reparo_necessario:"Reparo necessário", urgente:"Urgente — não rodar" };
  var NIVEIS = ["reserva","1/4","1/2","3/4","cheio"];
  var FIXAS = [["painel","Painel"],["frontal","Frente"],["traseira","Trás"]];
  var CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

  // --- dados que vêm do servidor (não vão pro rascunho) ---
  var HUBS = [], CAT = [];
  var session = null;     // auxiliar logado {access_token, refresh_token, expires_at, nome, matricula}
  var auxiliar = false;
  var busy = false, enviando = false, carregando = false, loginEmail = "";
  var arquivosPendentes = {}; // fotoKey -> Blob comprimido (para "tentar de novo")

  var S = novoEstado();
  function novoEstado(){
    return { id: uuid(), step:0, papel:null, matricula:"", nome:"", placa:"", veiculo:null, ultimo:null, abertas:[],
      tipo:null, hub_id:"", km:"", grupos:{}, prefill:{}, confirmacoes:{}, novas:[],
      nivel:"", bateria:"", fixas:{}, observacoes:"", enviado:null, pendente:null, salvo_em:Date.now() };
  }

  // ---------------- utilidades ----------------
  function uuid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, function(c){
      return (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16); });
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function $(id){ return document.getElementById(id); }
  function toast(msg, isErr){
    var host = $("toast"); host.innerHTML = '<div class="' + (isErr ? "e" : "") + '">' + esc(msg) + '</div>';
    clearTimeout(toast.t); toast.t = setTimeout(function(){ host.innerHTML = ""; }, 4200);
  }
  function fmtData(iso){ if (!iso) return ""; var d = new Date(iso); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}); }
  function fmtKm(n){ return n == null || n === "" ? "—" : Number(n).toLocaleString("pt-BR") + " km"; }
  function normPlaca(p){ return String(p || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }

  function salvarRascunho(){
    if (S.enviado) return;
    S.salvo_em = Date.now();
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); }catch(e){}
  }
  function lerRascunho(){ try{ var r = localStorage.getItem(DRAFT_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  function apagarRascunho(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

  // ---------------- sessão do auxiliar ----------------
  function salvarSessao(){ try{ session ? localStorage.setItem(SESSION_KEY, JSON.stringify(session)) : localStorage.removeItem(SESSION_KEY); }catch(e){} }
  function authToken(grant, body){
    return fetch(SUPA_URL + "/auth/v1/token?grant_type=" + grant, {
      method:"POST", headers:{ "apikey":SUPA_ANON, "Content-Type":"application/json" }, body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "Falha no login"); return j; }); });
  }
  function aplicarToken(j){
    session = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000,
                nome: session && session.nome, matricula: session && session.matricula };
    salvarSessao();
  }
  var refreshing = null;
  function ensureFreshSession(){
    if (!session) return Promise.resolve(null);
    if (session.expires_at > Date.now() + 60000) return Promise.resolve(session);
    if (refreshing) return refreshing;
    refreshing = authToken("refresh_token", { refresh_token: session.refresh_token }).then(function(j){
      refreshing = null; aplicarToken(j); return session;
    }).catch(function(){ refreshing = null; session = null; auxiliar = false; salvarSessao(); renderWho(); return null; });
    return refreshing;
  }

  // ---------------- chamadas à Edge Function ----------------
  function api(acao, dados){
    return ensureFreshSession().then(function(){
      var headers = { "apikey":SUPA_ANON, "Content-Type":"application/json" };
      if (session) headers["Authorization"] = "Bearer " + session.access_token;
      var body = Object.assign({ acao:acao, aparelho:APARELHO }, dados || {});
      return fetch(FN_URL, { method:"POST", headers:headers, body: JSON.stringify(body) });
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (!r.ok){ var err = new Error(j.error || ("Erro " + r.status)); err.dados = j; throw err; }
        return j;
      });
    }, function(e){ throw new Error(navigator.onLine === false ? "Sem conexão com a internet." : (e.message || "Falha de conexão.")); });
  }

  // ---------------- fotos: compressão + envio ----------------
  function carregarImagem(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){ res(img); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); };
      img.onerror = function(){ rej(new Error("Não foi possível ler a foto. Tente tirar de novo.")); };
      img.src = url;
    });
  }
  function redimensionar(img, max, q, comoDataUrl){
    var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
    var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    if (comoDataUrl) return Promise.resolve(c.toDataURL("image/jpeg", q));
    return new Promise(function(res){ c.toBlob(res, "image/jpeg", q); });
  }
  function putComProgresso(url, blob, onProg){
    return new Promise(function(res, rej){
      var x = new XMLHttpRequest();
      x.open("PUT", url); x.setRequestHeader("Content-Type", "image/jpeg"); x.setRequestHeader("x-upsert", "true");
      x.upload.onprogress = function(ev){ if (ev.lengthComputable) onProg(ev.loaded / ev.total); };
      x.onload = function(){ x.status >= 200 && x.status < 300 ? res() : rej(new Error("Falha ao enviar a foto (" + x.status + ")")); };
      x.onerror = function(){ rej(new Error("Falha de conexão ao enviar a foto.")); };
      x.send(blob);
    });
  }
  // foto = objeto guardado no estado: {key, path, thumb, status:'enviando'|'ok'|'erro', prog}
  function processarFoto(file, foto){
    foto.status = "enviando"; foto.prog = 0; render();
    return carregarImagem(file).then(function(img){
      return Promise.all([redimensionar(img, 1600, 0.8, false), redimensionar(img, 240, 0.7, true)]);
    }).then(function(r){
      arquivosPendentes[foto.key] = r[0]; foto.thumb = r[1]; render();
      return enviarFoto(foto);
    }).catch(function(e){ foto.status = "erro"; foto.msg = e.message; render(); toast(e.message, true); });
  }
  function enviarFoto(foto){
    var blob = arquivosPendentes[foto.key];
    if (!blob){ foto.status = "erro"; foto.msg = "Tire a foto de novo."; render(); return Promise.resolve(); }
    foto.status = "enviando"; foto.prog = 0; render();
    return api("upload", { matricula:S.matricula, placa:S.placa, checklist_id:S.id, arquivo: foto.key + ".jpg" }).then(function(u){
      return putComProgresso(u.signedUrl, blob, function(p){
        foto.prog = p; var el = document.querySelector('[data-bar="' + foto.key + '"]'); if (el) el.style.width = Math.round(p * 100) + "%";
      }).then(function(){ foto.path = u.path; foto.status = "ok"; delete arquivosPendentes[foto.key]; salvarRascunho(); render(); });
    }).catch(function(e){ foto.status = "erro"; foto.msg = e.message; render(); toast(e.message, true); });
  }
  function pedirFoto(cb){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp); // fora do DOM, alguns Safari (iOS) não disparam o onchange
    inp.onchange = function(){ if (inp.files && inp.files[0]) cb(inp.files[0]); inp.remove(); };
    inp.click();
  }
  function fotoKey(prefixo){ return (prefixo + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).toLowerCase().replace(/[^a-z0-9_-]/g, ""); }
  function thumbHtml(f, acaoRemover){
    var st = f.status === "ok" ? "" :
      f.status === "erro" ? '<div class="st err" data-retry="' + f.key + '">tentar de novo</div>' :
      '<div class="bar"><i data-bar="' + f.key + '" style="width:' + Math.round((f.prog || 0) * 100) + '%"></i></div>';
    return '<div class="thumb">' + (f.thumb ? '<img src="' + f.thumb + '" alt="">' : '<div class="cam">…</div>') + st +
      (acaoRemover ? '<button class="btn ghost" style="min-height:28px;padding:0 4px;font-size:12px;width:100%" ' + acaoRemover + '>remover</button>' : '') + '</div>';
  }

  // ---------------- regras ----------------
  function gruposAtuais(){
    if (!S.veiculo || !S.tipo) return [];
    var tc = S.veiculo.tipo_combustivel, map = {}, arr = [];
    CAT.forEach(function(it){
      if (it.tipos.indexOf(S.tipo) < 0) return;
      if (it.combustiveis && it.combustiveis.indexOf(tc) < 0) return;
      if (!map[it.grupo]){ map[it.grupo] = { grupo:it.grupo, nome:it.grupo_nome, ordem:it.grupo_ordem, itens:[] }; arr.push(map[it.grupo]); }
      map[it.grupo].itens.push(it);
    });
    return arr.sort(function(a, b){ return a.ordem - b.ordem; });
  }
  function itemPorCodigo(c){ for (var i = 0; i < CAT.length; i++) if (CAT[i].codigo === c) return CAT[i]; return null; }
  function nomeGrupo(g){ for (var i = 0; i < CAT.length; i++) if (CAT[i].grupo === g) return CAT[i].grupo_nome; return g; }
  function rotuloAnomalia(a){
    var it = a.item_codigo ? itemPorCodigo(a.item_codigo) : null;
    return (it ? it.descricao : "Outro problema") + (a.subtipo ? " — " + a.subtipo : "");
  }
  function todasFotos(){
    var l = [];
    S.novas.forEach(function(a){ a.fotos.forEach(function(f){ l.push(f); }); });
    Object.keys(S.fixas).forEach(function(k){ if (S.fixas[k]) l.push(S.fixas[k]); });
    return l;
  }
  // Bateria só para carro elétrico (pelo cadastro); os demais informam nível de combustível.
  function usaBateria(){ return !!S.veiculo && S.veiculo.tipo_combustivel === "eletrico"; }
  function usaCombustivel(){ return !!S.veiculo && !usaBateria(); }

  function validar(step){
    var e = [];
    if (step === 0){
      if (!S.nome) e.push("Confirme sua matrícula.");
      if (!S.veiculo) e.push("Busque a placa do veículo.");
      if (!S.tipo) e.push("Escolha o tipo de checklist.");
      if (S.pendente && S.tipo === "retirada") e.push("Faça primeiro a devolução do " + S.pendente.placa + ".");
      if (S.tipo === "inspecao_tecnica" && !auxiliar) e.push("Inspeção técnica exige login de auxiliar de frota.");
      if (!S.hub_id) e.push("Escolha o Hub.");
      if (!(Number(S.km) > 0)) e.push("Informe o KM do painel.");
    }
    if (step === 1){
      var gs = gruposAtuais();
      gs.forEach(function(g){
        var resp = S.grupos[g.grupo];
        if (!resp){ e.push(g.nome + ": responda se está tudo OK."); return; }
        S.abertas.forEach(function(a){ if (a.grupo === g.grupo && !S.confirmacoes[a.id]) e.push(g.nome + ": diga se \"" + rotuloAnomalia(a) + "\" continua."); });
        if (resp === "problema"){
          var ns = S.novas.filter(function(a){ return a.grupo === g.grupo; });
          if (!ns.length) e.push(g.nome + ": adicione o problema ou marque Tudo OK.");
          ns.forEach(function(a){
            var nome = g.nome + " / " + rotuloAnomalia(a);
            if (a.item_codigo === undefined) e.push(g.nome + ": escolha qual item tem problema.");
            else if (a.item_codigo === "" && !String(a.descricao || "").trim()) e.push(nome + ": descreva o problema.");
            var it = a.item_codigo ? itemPorCodigo(a.item_codigo) : null;
            if (it && it.subtipos && !a.subtipo) e.push(nome + ": escolha qual luz.");
            if (!a.fotos.some(function(f){ return f.status === "ok"; })) e.push(nome + ": foto obrigatória.");
          });
        }
      });
    }
    if (step === 2){
      if (usaCombustivel() && !S.nivel) e.push("Informe o nível de combustível.");
      if (usaBateria() && S.bateria === "") e.push("Informe o % de bateria.");
      if (S.bateria !== "" && !(Number(S.bateria) >= 0 && Number(S.bateria) <= 100)) e.push("% de bateria deve estar entre 0 e 100.");
      if (S.tipo === "inspecao_tecnica") FIXAS.forEach(function(f){ if (!(S.fixas[f[0]] && S.fixas[f[0]].status === "ok")) e.push("Foto obrigatória: " + f[1] + "."); });
    }
    if (step === 3){
      if (todasFotos().some(function(f){ return f.status !== "ok"; })) e.push("Espere todas as fotos terminarem de enviar (ou remova as que falharam).");
    }
    return e;
  }

  // ---------------- render ----------------
  function render(){
    renderWho();
    var steps = $("steps").children;
    for (var i = 0; i < steps.length; i++) steps[i].className = i <= S.step ? "on" : "";

    // antes das etapas: escolha Motorista/Auxiliar e, para auxiliar sem sessão, o login
    var escolha = !carregando && !S.enviado && (!S.papel || (S.papel === "auxiliar" && !session));
    var html = carregando ? '<div class="card"><p class="hint" style="margin:0">Carregando…</p></div>'
      : escolha ? (S.papel ? renderLogin() : renderEscolha())
      : S.enviado ? renderFinal() : [renderStep0, renderStep1, renderStep2, renderStep3][S.step]();
    $("main").innerHTML = html;
    $("steps").classList.toggle("hidden", escolha);
    $("step-label").classList.toggle("hidden", escolha);
    $("bottom").classList.toggle("hidden", !!S.enviado || escolha);
    $("btn-voltar").disabled = S.step === 0 || busy;
    $("btn-proximo").disabled = busy;
    $("btn-proximo").textContent = S.step === 3 ? (enviando ? "Enviando…" : "Enviar checklist") : "Próximo";
  }

        '<div class="hint" style="margin:2px 0 0">' + (u ? "Último: " + TIPOS[u.tipo] + " em " + fmtData(u.enviado_em) + " · " + fmtKm(u.km) : "Nenhum checklist anterior") + '</div></div>' +
        (S.abertas.length ? '<span class="badge alta">' + S.abertas.length + ' anomalia' + (S.abertas.length > 1 ? "s" : "") + ' aberta' + (S.abertas.length > 1 ? "s" : "") + '</span>' : '<span class="badge">sem pendências</span>') + '</div>';

      }
      h += '<label class="lbl" for="f-hub">Hub</label><select id="f-hub"><option value="">Selecione…</option>' +
        HUBS.map(function(x){ return '<option value="' + x.id + '"' + (S.hub_id === x.id ? " selected" : "") + '>' + esc(x.nome) + '</option>'; }).join("") + '</select>';
      h += '<label class="lbl" for="f-km">KM do painel</label><input type="number" inputmode="numeric" id="f-km" class="mono" min="0" value="' + esc(S.km) + '">';

    return ref ? '<div class="warn">KM menor que o último registrado (' + fmtKm(ref) + '). Confira o painel.</div>' : "";

  function renderStep1(){
    var gs = gruposAtuais(), codigos = gs.map(function(g){ return g.grupo; });
    var h = '<p class="hint" style="margin:0 0 12px">Para cada grupo, marque <b>Tudo OK</b> ou <b>Tem problema</b>. Problema novo precisa de foto.</p><div class="grupos-grid">';

        '<button class="chip bad' + (resp === "problema" ? " on" : "") + '" data-act="grupo" data-g="' + g.grupo + '" data-v="problema">Tem problema' + (abertas.length ? " novo" : "") + '</button></div>';

  function abertaHtml(a, comBotoes){

    return h;
  }

  function renderStep3(){
    var gs = gruposAtuais(), v = S.veiculo;
    var hub = HUBS.filter(function(x){ return x.id === S.hub_id; })[0];
    var h = '<div class="card"><h2>Confira antes de enviar</h2><ul class="resumo" style="padding-left:18px;margin:0">' +
      '<li><b>' + TIPOS[S.tipo] + '</b> · <span class="mono">' + esc(v.placa) + '</span> ' + esc(v.modelo || "") + '</li>' +
      '<li>' + esc(S.nome) + ' (matrícula ' + esc(S.matricula) + ') · Hub ' + esc(hub ? hub.nome : "") + '</li>' +
      '<li>KM ' + fmtKm(S.km) + (S.nivel ? " · Combustível " + esc(S.nivel) : "") + (S.bateria !== "" ? " · Bateria " + esc(S.bateria) + "%" : "") + '</li></ul></div>';
    var novas = S.novas.filter(function(a){ return S.grupos[a.grupo] === "problema"; });
    h += '<div class="card"><h2>Problemas novos (' + novas.length + ')</h2>';
    if (!novas.length) h += '<p class="hint" style="margin:0">Nenhum.</p>';
    novas.forEach(function(a){ h += '<div style="margin-bottom:6px"><span class="badge ' + a.severidade + '">' + SEV[a.severidade] + '</span> ' + esc(nomeGrupo(a.grupo)) + ' — ' + esc(rotuloAnomalia(a)) + (a.descricao ? '<div class="hint" style="margin:0">' + esc(a.descricao) + '</div>' : "") + '</div>'; });
    h += '</div>';
    var conf = S.abertas.filter(function(a){ return S.confirmacoes[a.id]; });
    if (conf.length){
      h += '<div class="card"><h2>Pendências anteriores</h2>';
      conf.forEach(function(a){ h += '<div style="margin-bottom:4px">' + esc(rotuloAnomalia(a)) + ': <b>' + (S.confirmacoes[a.id] === "continua" ? "continua" : "não existe mais") + '</b></div>'; });
      h += '</div>';
    }
    var okGrupos = gs.filter(function(g){ return S.grupos[g.grupo] === "ok"; }).map(function(g){ return g.nome; });
    if (okGrupos.length) h += '<div class="card"><h2>Tudo OK</h2><p class="hint" style="margin:0">' + esc(okGrupos.join(", ")) + '</p></div>';
    if (renderStep3.erro) h += '<div class="err">' + esc(renderStep3.erro) + '</div>';
    return h;
  }
  renderStep3.erro = "";

  function renderFinal(){
    var r = S.enviado.resultado;
    return '<div class="card final"><div style="font-size:15px;color:var(--muted)">Checklist enviado</div>' +
      '<div class="big res-' + r + '">' + RES[r] + '</div>' +
      '<p class="hint">' + TIPOS[S.tipo] + ' · <span class="mono">' + esc(S.veiculo.placa) + '</span> · ' + fmtData(new Date().toISOString()) + '</p>' +
      (r === "urgente" ? '<div class="err" style="text-align:left">Há problema crítico neste veículo. Avise a equipe de frota antes de rodar.</div>' : "") +
      '<button class="btn primary" data-act="novo" style="margin-top:16px;width:100%">Fazer outro checklist</button></div>';
  }

  // ---------------- ações ----------------
  function identificar(){
    var m = $("f-mat").value.trim();
    if (!/^\d+$/.test(m)){ toast("Digite só os números da matrícula.", true); return; }
    S.matricula = m; busy = true; render();
    return api("identificar", { matricula:m }).then(function(r){
      HUBS = r.hubs || []; CAT = r.catalogo || []; auxiliar = !!r.auxiliar;
      S.nome = r.nome; busy = false; salvarRascunho(); render();
      var pl = $("f-placa"); if (pl && !S.veiculo) pl.focus();
    }).catch(function(e){ busy = false; S.nome = ""; render(); toast(e.message, true); });
  }
  function buscarPlaca(tipoForcado){
    var p = normPlaca($("f-placa").value);
    if (p.length !== 7){ toast("Placa deve ter 7 caracteres (ex.: ABC1D23).", true); return; }
    if (S.veiculo && S.veiculo.placa !== p && (S.novas.length || Object.keys(S.fixas).length)){
      if (!confirm("Trocar de placa apaga os problemas e fotos já registrados. Continuar?")) return;
    }
    busy = true; render();
    api("veiculo", { matricula:S.matricula, placa:p }).then(function(r){
      busy = false;
      var trocou = !S.veiculo || S.veiculo.placa !== r.veiculo.placa;
      if (trocou){
        var keep = { matricula:S.matricula, nome:S.nome, papel:S.papel };
        S = novoEstado(); S.matricula = keep.matricula; S.nome = keep.nome; S.papel = keep.papel;
      }
      S.placa = r.veiculo.placa; S.veiculo = r.veiculo; S.ultimo = r.ultimo; S.abertas = r.anomalias_abertas || [];
      S.pendente = r.devolucao_pendente || null;
      if (trocou){
        S.tipo = tipoForcado || r.tipo_sugerido;
        if (S.ultimo && S.ultimo.nivel_combustivel) S.nivel = S.ultimo.nivel_combustivel;
        aplicarPrefill();
      }
      salvarRascunho(); render();
    }).catch(function(e){ busy = false; render(); toast(e.message, true); });
  }
  // Grupos que estavam OK no último checklist (e sem anomalia aberta) já vêm marcados como OK.
  function aplicarPrefill(){
    S.grupos = {}; S.prefill = {};
    if (!S.ultimo) return;
    (S.ultimo.grupos || []).forEach(function(g){
      var temAberta = S.abertas.some(function(a){ return a.grupo === g.grupo; });
      if (!g.tem_anomalia && !temAberta){ S.grupos[g.grupo] = "ok"; S.prefill[g.grupo] = true; }
    });
  }
  function mudarTipo(t){
    if (t === S.tipo) return;
    if (S.novas.length && !confirm("Mudar o tipo apaga os problemas já registrados neste checklist. Continuar?")) return;
    S.tipo = t; S.novas = []; aplicarPrefill(); salvarRascunho(); render();
  }
  function login(){
    var email = $("lg-email").value.trim(), senha = $("lg-senha").value;
    loginEmail = email; // sobrevive ao re-render (senha errada não apaga o e-mail)
    if (!email || !senha){ toast("Preencha e-mail e senha.", true); return; }
    busy = true; render();
    authToken("password", { email:email, password:senha }).then(function(j){
      aplicarToken(j); return api("sessao");
    }).then(function(r){
      busy = false;
      if (!r.auxiliar){ session = null; salvarSessao(); auxiliar = false; render(); toast("Seu usuário não tem acesso ao checklist de frota.", true); return; }
      session.nome = r.nome; session.matricula = r.matricula; salvarSessao(); auxiliar = true; S.papel = "auxiliar";
      if (r.matricula && !S.nome){ S.matricula = r.matricula; render(); identificar(); } else render();
    }).catch(function(e){ busy = false; render(); toast(e.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : e.message, true); });
  }
  function logout(){
    session = null; auxiliar = false; salvarSessao();
    if (S.tipo === "inspecao_tecnica"){ S.tipo = null; S.novas = []; aplicarPrefill(); }
    S.papel = null; salvarRascunho(); render();
  }
  function enviar(){
    var gs = gruposAtuais();
    var novas = S.novas.filter(function(a){ return S.grupos[a.grupo] === "problema"; });
    var fotos = [];
    novas.forEach(function(a){ a.fotos.forEach(function(f){ fotos.push({ tipo:"anomalia", anomalia_id:a.id, path:f.path }); }); });
    FIXAS.forEach(function(f){ var x = S.fixas[f[0]]; if (x && x.status === "ok") fotos.push({ tipo:f[0], path:x.path }); });
    var ck = {
      id:S.id, placa:S.placa, tipo:S.tipo, hub_id:S.hub_id, km:Number(S.km),
      nivel_combustivel: usaCombustivel() ? S.nivel : null,
      bateria_pct: S.bateria === "" ? null : Number(S.bateria),
      observacoes:S.observacoes,
      grupos: gs.map(function(g){ return g.grupo; }),
      anomalias: novas.map(function(a){ return { id:a.id, grupo:a.grupo, item_codigo:a.item_codigo || null, subtipo:a.subtipo || null, descricao:a.descricao || null, severidade:a.severidade }; }),
      confirmacoes: Object.keys(S.confirmacoes).map(function(k){ return { origem_id:k, confirmacao:S.confirmacoes[k] }; }),
      fotos: fotos
    };
    busy = enviando = true; renderStep3.erro = ""; render();
    api("enviar", { matricula:S.matricula, checklist:ck }).then(function(r){
      busy = enviando = false; S.enviado = r; apagarRascunho(); render(); window.scrollTo(0, 0);
    }).catch(function(e){
      busy = enviando = false;
      if (e.dados && e.dados.devolucao_pendente){ // trava de devolução: volta para a 1ª etapa com o botão de devolver
        S.pendente = e.dados.devolucao_pendente; S.step = 0; salvarRascunho(); render(); window.scrollTo(0, 0); toast(e.message, true); return;
      }
      renderStep3.erro = "Não foi possível enviar: " + e.message + " Seus dados continuam salvos neste aparelho; tente de novo."; render();
    });
  }

  function proximo(){
    var erros = validar(S.step);
    if (erros.length){ toast(erros[0], true); return; }
    if (S.step === 3){ enviar(); return; }
    S.step++; salvarRascunho(); render(); window.scrollTo(0, 0);
  }
  function voltar(){ if (S.step > 0){ S.step--; salvarRascunho(); render(); window.scrollTo(0, 0); } }

  // ---------------- eventos ----------------
  $("btn-proximo").addEventListener("click", proximo);
  $("btn-voltar").addEventListener("click", voltar);

  document.addEventListener("click", function(ev){
    var retry = ev.target.closest("[data-retry]");
    if (retry){
      var f = todasFotos().filter(function(x){ return x.key === retry.getAttribute("data-retry"); })[0];
      if (f) enviarFoto(f);
      return;
    }
    var b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), v = b.getAttribute("data-v"), i = Number(b.getAttribute("data-i"));
    switch (act){
      case "identificar": identificar(); break;
      case "buscar-placa": buscarPlaca(); break;
      case "fazer-devolucao": if (S.pendente){ $("f-placa").value = S.pendente.placa; buscarPlaca("devolucao"); } break;
      case "papel":
        $("toast").innerHTML = "";
        S.papel = v; salvarRascunho(); render(); window.scrollTo(0, 0);
        var foco = $(v === "auxiliar" ? "lg-email" : "f-mat"); if (foco && !foco.value) foco.focus();
        return;
      case "trocar-papel": $("toast").innerHTML = ""; S.papel = null; break;
      case "login": login(); break;
      case "logout": logout(); break;
      case "tipo": mudarTipo(v); break;
      case "grupo":
        var g = b.getAttribute("data-g");
        S.grupos[g] = v; delete S.prefill[g];
        if (v === "problema" && !S.novas.some(function(a){ return a.grupo === g; })) S.novas.push(novaAnomalia(g));
        if (v === "ok") S.novas = S.novas.filter(function(a){ return a.grupo !== g; });
        break;
      case "conf": S.confirmacoes[b.getAttribute("data-id")] = v; break;
      case "add-anom": S.novas.push(novaAnomalia(b.getAttribute("data-g"))); break;
      case "rm-anom":
        var gg = S.novas[i].grupo; S.novas.splice(i, 1);
        if (!S.novas.some(function(a){ return a.grupo === gg; })) delete S.grupos[gg];
        break;
      case "item":
        var a = S.novas[i]; a.item_codigo = v; a.subtipo = null;
        var it = v ? itemPorCodigo(v) : null; a.severidade = it ? it.severidade_padrao : (a.severidade || "media");
        break;
      case "subtipo": S.novas[i].subtipo = v; break;
      case "sev": S.novas[i].severidade = v; break;
      case "foto-anom":
        var an = S.novas[i];
        pedirFoto(function(file){ var f = { key: fotoKey(an.id.slice(0, 8)), status:"enviando" }; an.fotos.push(f); processarFoto(file, f); });
        return;
      case "rm-foto": S.novas[i].fotos.splice(Number(b.getAttribute("data-f")), 1); break;
      case "foto-fixa":
        pedirFoto(function(file){ var f = { key: fotoKey(v), status:"enviando" }; S.fixas[v] = f; processarFoto(file, f); });
        return;
      case "rm-fixa": delete S.fixas[v]; break;
      case "nivel": S.nivel = v; break;
      case "novo":
        // auxiliar logado continua; motorista volta para "Quem está preenchendo?" (celular pode ser compartilhado)
        var keep = { matricula:S.matricula, nome:S.nome };
        S = novoEstado();
        if (session){ S.papel = "auxiliar"; S.matricula = keep.matricula; S.nome = keep.nome; }
        render(); window.scrollTo(0, 0); return;
      default: return;
    }
    salvarRascunho(); render();
  });
  function novaAnomalia(g){ return { id: uuid(), grupo:g, item_codigo:undefined, subtipo:null, severidade:"media", descricao:"", fotos:[] }; }

  document.addEventListener("input", function(ev){
    var t = ev.target;
    if (t.id === "f-km"){ S.km = t.value; $("km-aviso").innerHTML = avisoKm(); }
    else if (t.id === "f-hub"){ S.hub_id = t.value; }
    else if (t.id === "f-bat"){ S.bateria = t.value; }
    else if (t.id === "f-obs"){ S.observacoes = t.value; }
    else if (t.hasAttribute && t.hasAttribute("data-desc")){ S.novas[Number(t.getAttribute("data-desc"))].descricao = t.value; }
    else if (t.id === "f-mat"){ if (S.nome && t.value.trim() !== S.matricula){ S.nome = ""; } return; }
    else return;
    salvarRascunho();
  });
  document.addEventListener("change", function(ev){ if (ev.target.id === "f-hub"){ S.hub_id = ev.target.value; salvarRascunho(); } });
  document.addEventListener("keydown", function(ev){
    if (ev.key !== "Enter") return;
    if (ev.target.id === "f-mat"){ ev.preventDefault(); identificar(); }
    else if (ev.target.id === "f-placa"){ ev.preventDefault(); buscarPlaca(); }
    else if (ev.target.id === "lg-senha"){ ev.preventDefault(); login(); }
  });

  // ---------------- início ----------------
  function iniciar(){
    try{ session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ session = null; }
    var r = lerRascunho();
    var validoAte = 24 * 3600 * 1000;
    var pSessao = session ? api("sessao").then(function(x){
      auxiliar = !!x.auxiliar; if (!auxiliar){ session = null; salvarSessao(); } else { session.nome = x.nome; session.matricula = x.matricula; salvarSessao(); }
    }).catch(function(){}) : Promise.resolve();

    pSessao.then(function(){
      if (r && r.matricula && !r.enviado && Date.now() - (r.salvo_em || 0) < validoAte &&
          confirm("Há um checklist não enviado" + (r.placa ? " da placa " + r.placa : "") + ". Continuar de onde parou?")){
        S = r;
        S.papel = session ? "auxiliar" : (r.papel === "motorista" ? "motorista" : null);
        // fotos que estavam subindo quando a página fechou precisam ser tiradas de novo
        todasFotos().forEach(function(f){ if (f.status !== "ok"){ f.status = "erro"; f.msg = "Tire a foto de novo."; } });
        busy = carregando = true; render();
        return api("identificar", { matricula:S.matricula }).then(function(x){
          HUBS = x.hubs || []; CAT = x.catalogo || []; auxiliar = !!x.auxiliar;
          if (!S.placa) return;
          return api("veiculo", { matricula:S.matricula, placa:S.placa }).then(function(v){
            S.veiculo = v.veiculo; S.ultimo = v.ultimo; S.abertas = v.anomalias_abertas || []; S.pendente = v.devolucao_pendente || null;
            var ids = S.abertas.map(function(a){ return a.id; });
            Object.keys(S.confirmacoes).forEach(function(k){ if (ids.indexOf(k) < 0) delete S.confirmacoes[k]; });
          });
        }).then(function(){ busy = carregando = false; render(); }).catch(function(e){ busy = carregando = false; S.step = 0; render(); toast(e.message, true); });
      }
      apagarRascunho();
      if (session){
        S.papel = "auxiliar";
        if (session.matricula){ S.matricula = session.matricula; render(); return identificar(); }
      }
      render();
    });
    render();
  }
  iniciar();
})();
</script>
</body>
</html>
